<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEBVOID</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bg-canvas-container"></div>
    <div id="fg-canvas-container"></div>
    <div id="cube-count-display">CUBE COUNT: 0/0</div>
    <div id="btn-bookmarks">[ ARCHIVES ]</div>
    
    <!-- Modals and Overlays -->
    <div id="bookmarks-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <button id="close-bookmarks">X</button>
            <h2>ARCHIVED TRANSMISSIONS</h2>
            <div id="bookmarks-list"></div>
        </div>
    </div>
    <div id="teleport-flash" class="teleport-flash"></div>
    
    <!-- UI Controls -->
    <div class="ui-left">
        <input type="text" id="spyglass-search" placeholder="Search Transmissions...">
        <div id="search-results"></div>
    </div>
    
    <!-- Navigation -->
    <div class="nav-controls">
        <button id="btn-prev" class="hud-button">&lt; PREV</button>
        <button id="btn-next" class="hud-button">NEXT &gt;</button>
    </div>
    
    <!-- Main Content Area -->
    <div id="post-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Modular Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
