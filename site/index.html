<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.E.B.VOID</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-node="home">

  <div id="loading-screen" class="loading-screen"></div>

  <div id="bg-canvas-container" class="layer"></div>
  <div id="fg-canvas-container" class="layer"></div>

  <div class="ui-overlay">
    <div class="ui-left">
      <div class="ui-box ui-header" id="inventory-toggle">
        <span class="ascii-plant">INVENTORY \/</span>
      </div>
      <div class="ui-box ui-body" id="inventory-body">
        <div class="ui-item">
          <div class="voxel-wrapper">
            <div class="voxel-cube">
              <div class="voxel-face front"></div><div class="voxel-face back"></div>
              <div class="voxel-face right"></div><div class="voxel-face left"></div>
              <div class="voxel-face top"></div><div class="voxel-face bottom"></div>
            </div>
          </div>
          <span id="cube-count-display">CUBE COUNT: 0/0</span>
        </div>

        <div class="ui-item search-container">
          <span>SEARCH</span>
          <input type="text" id="spyglass-search" placeholder="#hashtags or text..." autocomplete="off">
          <div id="search-results" class="search-dropdown"></div>
        </div>

        <button class="ui-box ui-header hud-button" id="btn-bookmarks" style="margin-top: 0.5rem; border-bottom: 4px solid var(--color-black);">
          [ ARCHIVES ]
        </button>

        <div class="inventory-map-container">
          <div class="ascii-art" id="ascii-map"></div>
        </div>
      </div>
    </div>

    <div class="ui-right">
      <div class="nav-stack">
        <button class="ui-box ui-header hud-button" id="btn-next">NEXT</button>
        <button class="ui-box ui-header hud-button" id="btn-prev">PREV</button>
      </div>
    </div>
  </div>

  <div id="post-container" class="layer layer-mg" style="pointer-events: none;"></div>

  <div id="bookmarks-modal" class="modal-overlay" style="display:none;">
    <div class="ui-box modal-content">
      <div class="ui-header" style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0; color:var(--color-black);">ARCHIVED POSTS</h2>
        <button id="close-bookmarks" class="hud-button" style="width:auto; padding:0.2rem 1rem;">X</button>
      </div>
      <div id="bookmarks-list" class="ui-body" style="display:block; overflow-y:auto;"></div>
    </div>
  </div>

  <div id="teleport-flash" class="teleport-flash"></div>
  <div id="transition-overlay" class="transition-overlay"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
